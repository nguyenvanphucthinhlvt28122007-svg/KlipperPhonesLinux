name: Build Samsung A5 Firmware

on:
  push:
    paths:
      - '.github/workflows/build-a5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        shell: bash
        run: |
          set -euxo pipefail

          cd LinuxKernels/scripts
          chmod +x *.sh

          export DEBIAN_FRONTEND=noninteractive
          arch="$(dpkg --print-architecture)"
          echo "Build architecture: ${arch}"

          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            debhelper \
            debhelper-compat \
            "libdw-dev:${arch}" \
            "libelf-dev:${arch}" \
            "libssl-dev:${arch}" \
            bc \
            bison \
            flex \
            libncurses-dev \
            pahole \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu

          sudo ./init.sh

          # init.sh installs packages independently, so enforce the required
          # package after it has completed.
          sudo apt-get update
          sudo apt-get install -y --reinstall "libssl-dev:${arch}"

          dpkg-query -W \
            -f='Status=${Status}\nArchitecture=${Architecture}\nVersion=${Version}\n' \
            "libssl-dev:${arch}"

          apt-cache policy "libssl-dev:${arch}"
          
      - name: Clone kernel source
        run: |
          set -euxo pipefail
          cd LinuxKernels/scripts
          git clone https://github.com/msm8916-mainline/linux --depth 1 ./linux
          find ./linux -type f -name control -print0 | xargs -0 sed -i 's/debhelper-compat (= 12)/debhelper-compat (>= 12)/g' || true
          
      - name: Copy Kernel Config
        run: |
          set -euxo pipefail
          cd LinuxKernels/scripts
          cp ../msm8916/.config ./linux/.config
          make -C ./linux ARCH=arm64 olddefconfig
          
      - name: Compile Kernel
        id: compile
        run: |
          set -o pipefail
          cd LinuxKernels/scripts
          ./full_compile.sh 2>&1 | tee compile.log
          
      - name: Report Error
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build failed. Creating an issue with logs."
          cd LinuxKernels/scripts
          {
            echo '```text'
            if [ -f compile.log ]; then
              tail -n 200 compile.log
            else
              echo "Compilation did not start; compile.log was not created."
            fi
            echo '```'
          } > error_snippet.txt
          gh issue create --title "Build failed for Samsung A5" --body-file error_snippet.txt || true
          
      - name: Download and setup RootFS
        if: success()
        run: |
          cd LinuxKernels/scripts
          wget https://github.com/umeiko/KlipperPhonesLinux/releases/download/base_rootfs/klipperos_base_rootfs.zip
          img_file=$(unzip -Z1 klipperos_base_rootfs.zip | grep -E '\.img$' | head -n 1)
          unzip klipperos_base_rootfs.zip
          if [ "$img_file" != "root.img" ] && [ -n "$img_file" ]; then
            mv "$img_file" root.img
          fi
          
      - name: Mount RootFS
        if: success()
        run: |
          cd LinuxKernels/scripts
          sudo mkdir -p /mnt/chroot
          sed -i '/chroot \/mnt\/chroot/d' mount_rootfs.sh
          sudo ./mount_rootfs.sh
          
      - name: Install Kernel in RootFS
        if: success()
        run: |
          sudo chroot /mnt/chroot /bin/bash -c "cd /tmp && chmod +x install_kernel.sh && ./install_kernel.sh"
          
      - name: Copy Firmware
        if: success()
        run: |
          cd LinuxKernels/scripts
          if [ -d "../msm8916/firmware" ]; then
            sudo cp -r ../msm8916/firmware/* /mnt/chroot/lib/firmware/
          else
            echo "No firmware folder found, skipping."
          fi
          
      - name: Generate Flash Package
        if: success()
        run: |
          cd LinuxKernels/scripts
          sed -i "s/\*mido\*/\*a5u\*/g" get_kernel_files.sh
          sudo ./get_kernel_files.sh
          sudo ./mkboot.sh
          
      - name: Unmount RootFS
        if: always()
        run: |
          cd LinuxKernels/scripts
          sudo ./umount_rootfs.sh || true
          
      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KlipperOS-Firmware-a5u
          path: |
            LinuxKernels/scripts/tmp_mkboot/boot.img
            LinuxKernels/scripts/tmp_mkboot/rootfs.img
